<text x="600" y="305" font-size="22" font-weight="bold">Webex Control Hub</text>
<text x="600" y="337" font-size="19">Organization and meeting-site settings</text>
<rect x="175" y="445" width="650" height="75" rx="8" fill="#edf1f8" stroke="#96a4b9"/>
<text x="198" y="477" font-size="22" font-weight="bold">Physical workstation · Charles Holland</text>
